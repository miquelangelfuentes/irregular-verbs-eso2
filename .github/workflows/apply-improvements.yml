name: Build and polish Verb Quest

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-improvements.py'
      - '*.html'
      - '*.js'
      - '*.css'
      - '.github/workflows/apply-improvements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish and build production CSS
        run: python tools/apply-improvements.py

      - name: Apply shared portal theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          theme = '<link rel="stylesheet" href="portal-theme.css?v=1" />'
          text = re.sub(r'portal-theme\.css(?:\?v=\d+)?', 'portal-theme.css?v=1', text)
          if 'portal-theme.css' not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="styles.css?v=4.0" />',
                  '<link rel="stylesheet" href="styles.css?v=4.0" />\n  ' + theme,
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove school stamp from exam certificate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated = re.sub(
              r'\s*<div>\s*<p class="font-semibold text-slate-800">Segell del centre escolar:</p>\s*<div class="w-32 h-10 border border-dashed border-slate-400 mt-1"></div>\s*</div>',
              '',
              text,
              count=1,
          )
          if updated != text:
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit generated updates
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar tema visual compartit a Verb Quest"
          git push
