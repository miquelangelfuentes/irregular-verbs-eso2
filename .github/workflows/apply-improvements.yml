name: Apply Verb Quest improvements

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-improvements.py'
      - 'enhancements.js'
      - '.github/workflows/apply-improvements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply improvements
        run: python tools/apply-improvements.py

      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css verbs-data.js README.md
          git commit -m "Aplicar millores pedagògiques i d'accessibilitat a Verb Quest"
          git push
