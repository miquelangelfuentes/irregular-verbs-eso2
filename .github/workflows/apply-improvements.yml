name: Build and polish Verb Quest

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-improvements.py'
      - '*.html'
      - '*.js'
      - '*.css'
      - '.github/workflows/apply-improvements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish and build production CSS
        run: python tools/apply-improvements.py

      - name: Commit generated updates
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polir Verb Quest i compilar Tailwind"
          git push
