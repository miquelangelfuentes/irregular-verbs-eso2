name: Build and polish Verb Quest

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-improvements.py'
      - '*.html'
      - '*.js'
      - '*.css'
      - '.github/workflows/apply-improvements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish and build production CSS
        run: python tools/apply-improvements.py

      - name: Apply shared portal theme and contrast layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          theme_css = '<link rel="stylesheet" href="portal-theme.css?v=3" />'
          contrast_css = '<link rel="stylesheet" href="portal-contrast.css?v=1" />'
          theme_js = '<script src="portal-theme.js?v=3"></script>'

          text = re.sub(r'portal-theme\.css(?:\?v=\d+)?', 'portal-theme.css?v=3', text)
          text = re.sub(r'portal-contrast\.css(?:\?v=\d+)?', 'portal-contrast.css?v=1', text)
          text = re.sub(r'portal-theme\.js(?:\?v=\d+)?', 'portal-theme.js?v=3', text)

          if 'portal-theme.css' not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="styles.css?v=4.0" />',
                  '<link rel="stylesheet" href="styles.css?v=4.0" />\n  ' + theme_css,
                  1,
              )

          if 'portal-contrast.css' not in text:
              text = re.sub(
                  r'(<link rel="stylesheet" href="portal-theme\.css\?v=3"\s*/?>)',
                  r'\1\n  ' + contrast_css,
                  text,
                  count=1,
              )

          if 'portal-theme.js' not in text:
              text = text.replace('</head>', '  ' + theme_js + '\n</head>', 1)

          if 'class="portal-theme-toggle"' not in text:
              button = '<button type="button" class="portal-theme-toggle" aria-label="Activa el mode fosc" title="Activa el mode fosc"></button>'
              updated, count = re.subn(
                  r'(\n\s*)(<button onclick="state\.soundEnabled)',
                  r'\1' + button + r'\1\2',
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError('No s’ha pogut inserir el botó de mode abans del botó de so')
              text = updated

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove school stamp from exam certificate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated = re.sub(
              r'\s*<div>\s*<p class="font-semibold text-slate-800">Segell del centre escolar:</p>\s*<div class="w-32 h-10 border border-dashed border-slate-400 mt-1"></div>\s*</div>',
              '',
              text,
              count=1,
          )
          if updated != text:
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit generated updates
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar auditoria de contrast clar i fosc"
          git push
