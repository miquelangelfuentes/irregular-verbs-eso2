name: Add final accessibility script

on:
  push:
    branches: [main]
    paths:
      - 'tools/add-accessibility-script.py'
      - 'accessibility.js'
      - '.github/workflows/add-accessibility-script.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add accessibility script to the page
        run: python tools/add-accessibility-script.py

      - name: Commit generated update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Carregar els ajustos finals d'accessibilitat"
          git push
