<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Fons arrodonit amb gradient de marca -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Vora subtil interior -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Icona de llamp central (zap) en blanc nítid -->
  <path d="M35 12L15 35H32L30 52L50 27H33L35 12Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- Punt brillant decoratiu (groc daurat Verb Quest) -->
  <circle cx="50" cy="14" r="3.5" fill="#facc15" />
</svg>
